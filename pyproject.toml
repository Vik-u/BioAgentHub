[build-system]
requires = ["setuptools>=65.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioagenthub-ibf"
version = "0.1.0"
description = "BioAgentHub: RAG + RL + Protocols across Topics"
readme = "README.md"
authors = [{ name = "Vikas Upadhyay", email = "viku@illinois.edu" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = [
    "bioinformatics",
    "rag",
    "llm",
    "agents",
    "biofoundry",
    "protein engineering",
]
requires-python = ">=3.9"
dependencies = [
    "numpy==1.24.4",
    "scipy==1.11.4",
    "torch==2.4.1+cpu",
    "torchvision==0.19.1+cpu",
    "faiss-cpu==1.8.0.post1",
    "sentence-transformers==2.2.2",
    "transformers==4.30.2",
    "huggingface-hub==0.15.1",
    "langchain-core==0.2.27",
    "langgraph==0.2.5",
    "requests>=2.32.3",
    "pdfplumber==0.11.5",
    "pydantic-ai-slim[openai]==0.0.18",
    "pypdf==4.3.1",
    "pdfminer.six==20231228",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "typer>=0.12.0",
    "gradio>=4.0.0",
    "protobuf>=3.20.3,<5.0.0",
    "bottleneck>=1.3.6",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "coverage[toml]>=7.0",
]
lint = [
    "ruff>=0.6",
]
typecheck = [
    "mypy>=1.8",
]

[project.scripts]
# CLI entrypoints (require `app` to be a package)
bioagenthub-cli = "app.hub_cli:main"
bioagenthub-gradio = "app.gradio_chatbot:main"
bioagenthub-qa-chat = "app.qa_chat_langgraph:main"
bioagenthub-protocol = "app.protocol_agent_cli_v2:main"
bioagenthub-instrument-protocol = "app.instrument_protocol_cli_v2:main"
bioagenthub-forge = "forge.run_forge:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agents*",
    "app*",
    "fabric*",
    "forge*",
    "services*",
    "utils*",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["agents", "app", "fabric", "forge", "services", "utils"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 15
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
