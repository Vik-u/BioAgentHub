name: audit-smoke

on:
  push:
  pull_request:

jobs:
  audit-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: KG noise audit (fixture)
        run: |
          python tools/kg_noise_audit.py --root tests/fixtures/workspace_tiny --metrics-out /tmp/kg_noise_metrics.json
